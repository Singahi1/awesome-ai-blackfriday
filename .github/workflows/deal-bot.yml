name: deal-bot

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

concurrency:
  group: deal-bot
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bot dependencies
        run: |
          python -m pip install -r requirements-bot.txt
          python -m playwright install --with-deps chromium
      - name: Verify due offers and discover seasonal candidates
        run: python3 scripts/deal_bot.py
      - name: Regenerate runtime data, README, static pages and feeds
        run: |
          python3 scripts/dataset.py
          python3 scripts/validate.py
          python3 scripts/build_readme.py
          python3 scripts/build_site.py
          python3 scripts/smoke_test.py
      - name: Ensure bot labels exist
        run: |
          gh label create "automated-deal-refresh" --color "0e8a16" --description "Created by the deal verification bot" --force
          gh label create "safe-auto-merge" --color "bfdadc" --description "Verification metadata only; CI-gated auto-merge" --force
          gh label create "needs-human-review" --color "d93f0b" --description "Content change or new deal; human review required" --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create or update the new-offer candidate issue
        uses: actions/github-script@v7
        env:
          CANDIDATES_PATH: bot-output/candidates.md
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(process.env.CANDIDATES_PATH, 'utf8');
            const title = 'Deal bot — new offer candidates';
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.data.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
      - name: Open or update the verification PR
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: bot/deal-refresh
          delete-branch: true
          title: "bot: verify AI deals and discover seasonal offers"
          body-path: bot-output/report.md
          labels: automated-deal-refresh
          add-paths: |
            data/deals.source.json
            data/deals.json
            data/deals.js
            README.md
            index.html
            black-friday/index.html
            archive/index.html
            feed.xml
            sitemap.xml
            robots.txt
      - name: Review and merge verification-only changes
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: bash scripts/review_and_merge_bot_pr.sh "$PR_NUMBER" bot-output/summary.json
